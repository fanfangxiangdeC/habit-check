<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>习惯打卡</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="header-top">
        <div>
          <h1 class="title">习惯打卡</h1>
          <p class="date" id="dateLabel"></p>
        </div>
        <button class="btn-add" id="btnAdd" aria-label="添加习惯" title="添加习惯">+</button>
      </div>

      <div class="progress-card">
        <div class="progress-text">
          <span id="progressText">今天完成 0 / 0</span>
          <span class="progress-pct" id="progressPct"></span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>

      <div class="config-banner hidden" id="configBanner">
        还没连接到数据库：请先在 <code>js/config.js</code> 中填入 Supabase 项目的 URL 和 anon key（见 README）。
      </div>
    </header>

    <main>
      <ul class="habit-list" id="habitList"></ul>
      <div class="empty hidden" id="emptyState">
        <div class="empty-emoji">🌱</div>
        <p>还没有习惯</p>
        <p class="empty-hint">点击右上角 + 添加第一个吧，例如：喝水、运动、读书</p>
      </div>
    </main>
  </div>

  <!-- 添加习惯弹窗 -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true">
      <h2>添加习惯</h2>
      <label for="inputName">名称</label>
      <input id="inputName" placeholder="例如：喝水" maxlength="20" autocomplete="off" />
      <label>图标（选一个或自己输入 emoji）</label>
      <div class="emoji-picker" id="emojiPicker"></div>
      <input id="inputEmoji" maxlength="8" autocomplete="off" />
      <div class="modal-actions">
        <button class="btn-cancel" id="btnCancel">取消</button>
        <button class="btn-primary" id="btnSave">保存</button>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
